<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .container { max-width: 600px; }
    .card { border: none; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .hidden-field { display: none; }
  </style>
</head>
<body class="py-4">
  <nav class="navbar navbar-expand navbar-dark bg-primary sticky-top mb-3">
    <div class="container-fluid">
      <div class="navbar-nav w-100 justify-content-around">
        <a class="nav-link active" onclick="nav('registro', this)">📝 Registro</a>
        <a class="nav-link" onclick="nav('balance', this)">💰 Balance</a>
        <a class="nav-link" onclick="nav('deuda', this)">💳 Deuda</a>
        <a class="nav-link" onclick="nav('cálculos', this)">📊 Cálculos</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div id="sec-registro" class="content-section">
      <div class="container">
        <div class="card p-4">
      <h3 class="mb-4 text-primary text-center">Registro de Gastos</h3>
      <form id="mainForm">
        
        <div class="mb-3">
          <label class="form-label font-weight-bold">Concepto</label>
          <input type="text" name="concepto" class="form-control" placeholder="Descripción del gasto" required>
        </div>
        
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Monto</label>
            <input type="number" step="0.01" name="monto" class="form-control" required>
          </div>
          <div class="col">
            <label class="form-label">Categoría (E=Egreso, I=Ingreso)</label>
            <select name="categoria" id="categoria" class="form-select">
              <option value="">Cargando opciones...</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-6">
            <label class="form-label">Fecha Cargo</label>
            <input type="date" name="fecha_cargo" id="fecha_cargo" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label">Gasto x Mes</label>
            <select name="gasto_x_mes" id="gasto_x_mes" class="form-select">
              <option value="">Cargando opciones...</option>
            </select>
          </div>
          <div class="col">
            <label class="form-label">Fecha Pago (Opcional)</label>
            <input type="date" name="fecha_pago" class="form-control">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <label class="form-label">Tipo Gasto</label>
            <select name="tipo_gasto" id="tipo_gasto" class="form-select" onchange="toggleMensualidades()">
              <option value="">Cargando opciones...</option>
            </select>
          </div>
        </div>

        <div id="mensualidadesGroup" class="row mb-3 hidden-field">
          <div class="col">
            <label class="form-label">Mes Actual (#)</label>
            <input type="number" name="no_mens" class="form-control" value="1" min="1" max="48">
          </div>
          <div class="col">
            <label class="form-label">Total Meses</label>
            <input type="number" name="total_meses" class="form-control" value="1" min="1" max="48">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Forma de Pago</label>
          <select name="forma_pago" id="forma_pago" class="form-select">
            <option value="">Cargando opciones...</option>
          </select>
        </div>

        <div class="row mb-4">
          <div class="col">
            <label class="form-label">Tag (NA=No Aplica, D=Debo a Lulú, MD=Me Debe Lulú)</label>
            <select name="tag" id="tag" class="form-select">
              <option value="">Cargando opciones...</option>
            </select>
          </div>
          <div class="col">
            <label class="form-label">¿Se divide?</label>
            <select name="se_divide" id="se_divide" class="form-select">
              <option value="">Cargando opciones...</option>
            </select>
          </div>
        </div>

        <button type="button" id="submitBtn" onclick="submitForm()" class="btn btn-primary w-100 shadow-sm">
          Guardar en unificado_v4
        </button>
      </form>
      <div id="output" class="mt-3 text-center fw-bold"></div>
        </div>
      </div>
    </div>

    <div id="sec-balance" class="content-section d-none">
      <div class="table-container" id="tab-balance"></div>
    </div>

    <div id="sec-deuda" class="content-section d-none">
      <div class="table-container" id="tab-deuda"></div>
    </div>

    <div id="sec-cálculos" class="content-section d-none">
      <div class="table-container" id="tab-cálculos"></div>
    </div>
  </div>

  <style>
    /* Optimización para visualización de tablas en smartphone */
    .table-container { 
      overflow-x: auto; 
      font-size: 0.75rem; /* Letra pequeña para que quepa más info */
    }
    table { white-space: nowrap; }
    th { background-color: #f8f9fa; position: sticky; top: 0; }
  </style>

  <script>
    function nav(section, el) {
      // 1. Gestionar clases de los links
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      el.classList.add('active');

      // 2. Gestionar visibilidad de secciones
      document.querySelectorAll('.content-section').forEach(s => s.classList.add('d-none'));
      document.getElementById('sec-' + section).classList.remove('d-none');

      // 3. Si no es registro, cargar la tabla
      if (section !== 'registro') {
        loadTable(section);
      }
    }

    function loadTable(sheetName) {
      const container = document.getElementById('tab-' + sheetName);
      container.innerHTML = '<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>';

      google.script.run
        .withSuccessHandler(data => {
          if (!data || typeof data === 'string') {
            container.innerHTML = "No se pudo cargar la hoja.";
            return;
          }

          let html = '<table class="table table-sm table-striped table-bordered">';
          data.forEach((row, index) => {
            html += '<tr>';
            row.forEach(cell => {
              // Si es la fila de encabezados (según tus CSVs suele ser la 2, index 1)
              if (index === 1) {
                html += `<th class="table-dark">${cell}</th>`;
              } else {
                html += `<td>${cell}</td>`;
              }
            });
            html += '</tr>';
          });
          html += '</table>';
          container.innerHTML = html;
        })
        .getSheetTable(sheetName);
    }

    /// Al cargar la página, inicializamos con la fecha de hoy
    window.onload = function() {
      // 1. Configuración de fecha inicial
      const hoy = new Date();
      // Ajuste de zona horaria local para el input date
      const offset = hoy.getTimezoneOffset() * 60000;
      const localISOTime = (new Date(hoy - offset)).toISOString().slice(0, 10);

      document.getElementById('fecha_cargo').value = localISOTime;

      // 2. Carga dinámica de la Capa de Datos
      google.script.run
      .withSuccessHandler(llenarFormulario)
      .withFailureHandler(err => console.error("Error cargando listas:", err))
      .getFormOptions();
    };

    /**
    * Inyecta las opciones en cada elemento select del DOM.
    */
    function llenarFormulario(opts) {
      // Mapeo: ID del HTML vs Llave del objeto del backend
      const mapping = {
        'tipo_gasto': opts.tiposGasto,
        'forma_pago': opts.formasPago,
        'tag': opts.tags,
        'categoria': opts.categorias,
        'se_divide': opts.seDivide,
        'gasto_x_mes': opts.abrevs
      };

      for (const id in mapping) {
        const select = document.getElementById(id);
        if (!select) continue;

        // Limpiar opciones previas (como el "Cargando...")
        select.innerHTML = '';

        mapping[id].forEach(val => {
          const option = document.createElement('option');
          option.value = val;
          option.textContent = val;
          select.appendChild(option);
        });
      }

      // Una vez llenos los selectores, calculamos la abreviatura por defecto
      actualizarAbrev();
    }

    // Seteo de fecha default
    document.getElementById('fecha_cargo').valueAsDate = new Date();

    function toggleMensualidades() {
      const tipo = document.getElementById('tipo_gasto').value;
      const group = document.getElementById('mensualidadesGroup');
      group.style.display = (tipo === 'MSI' || tipo === 'MCI') ? 'flex' : 'none';
    }

    // Función para calcular la abreviatura automáticamente
    function actualizarAbrev() {
      const fechaInput = document.getElementById('fecha_cargo').value;
      if (!fechaInput) return;

      const fecha = new Date(fechaInput + "T00:00:00");
      const mesesAbrev = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP",  "OCT", "NOV", "DIC"];
      
      // Seleccionamos automáticamente el valor en el dropdown
      const selectAbrev = document.getElementById('gasto_x_mes');
      selectAbrev.value = mesesAbrev[fecha.getMonth()];
    }

    

    function submitForm() {
      const btn = document.getElementById('submitBtn');
      const out = document.getElementById('output');
      const form = document.getElementById('mainForm');

      const data = {};
      let hasEmptyFields = false;
      
      new FormData(form).forEach((v, k) => {
        data[k] = v;
        if (k !== 'fecha_pago' && String(v).trim() === '') {
          hasEmptyFields = true;
        }
      });

      if (hasEmptyFields || !form.checkValidity()) {
        form.reportValidity();
        out.className = "mt-3 text-center text-danger";
        out.innerText = "Error: Todos los campos son obligatorios excepto Fecha Pago.";
        return;
      }

      btn.disabled = true;
      out.className = "mt-3 text-center text-muted";
      out.innerText = "Enviando a Google Sheets...";

      // Validación de mensualidades
      if (parseInt(data.no_mens) > parseInt(data.total_meses)) {
        out.className = "mt-3 text-center text-danger";
        out.innerText = "Error: El mes actual no puede ser mayor al total de meses.";
        btn.disabled = false;
        return;
      }

      google.script.run
        .withSuccessHandler(res => {
          out.className = "mt-3 text-center text-success";
          out.innerText = res;
          form.reset();
          document.getElementById('fecha_cargo').valueAsDate = new Date();
          toggleMensualidades();
          btn.disabled = false;
        })
        .withFailureHandler(err => {
          out.className = "mt-3 text-center text-danger";
          out.innerText = "Error: " + err;
          btn.disabled = false;
        })
        .registrarGasto(data);
    }
  </script>
</body>
</html>
