<div class="container">
  <div class="card p-4">
    <h2 class="text-center mb-4">Ingresar registro</h2>
    <form id="formGasto">
      <div class="mb-3">
        <label for="concepto" class="form-label">Concepto</label>
        <input type="text" class="form-control" id="concepto" name="concepto" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="monto" class="form-label">Monto</label>
          <input type="number" step="0.01" class="form-control" id="monto" name="monto" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="tipo_gasto" class="form-label">Tipo</label>
          <select name="tipo_gasto" id="tipo_gasto" class="form-select" onchange="toggleMensualidades()">
            <option>Cargando...</option>
          </select>
        </div>
      </div>
      <div id="mensualidadesGroup" class="hidden-field">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="no_mens" class="form-label">Mes Actual</label>
            <input type="number" class="form-control" id="no_mens" name="no_mens" value="0">
          </div>
          <div class="col-md-6 mb-3">
            <label for="total_meses" class="form-label">Total de Meses</label>
            <input type="number" class="form-control" id="total_meses" name="total_meses" value="0">
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label for="forma_pago" class="form-label">Forma de Pago</label>
        <select name="forma_pago" id="forma_pago" class="form-select">
          <option>Cargando...</option>
        </select>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="fecha_cargo" class="form-label">Fecha de Cargo</label>
          <input type="date" class="form-control" id="fecha_cargo" name="fecha_cargo" onchange="actualizarAbrev()" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="fecha_pago" class="form-label">Fecha de Pago (Opcional)</label>
          <input type="date" class="form-control" id="fecha_pago" name="fecha_pago">
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select name="categoria" id="categoria" class="form-select">
            <option>Cargando...</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="tag" class="form-label">Tag</label>
          <select name="tag" id="tag" class="form-select">
            <option>Cargando...</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label for="se_divide" class="form-label">Se Divide</label>
          <select name="se_divide" id="se_divide" class="form-select">
            <option>Cargando...</option>
          </select>
        </div>
      </div>
      <div class="mb-3">
        <label for="gasto_x_mes" class="form-label">Abreviatura Mes</label>
        <select name="gasto_x_mes" id="gasto_x_mes" class="form-select">
          <option>Cargando...</option>
        </select>
      </div>
      <button type="button" id="btnSubmit" class="btn btn-primary w-100" onclick="submitForm()">Guardar</button>
    </form>
    <div id="output" class="mt-3 text-center"></div>
  </div>
</div>
