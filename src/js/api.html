<script>
  const API = {
    getOptions: (cb) => google.script.run.withSuccessHandler(cb).getFormOptions(),
    save: (data, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).registrarGasto(data),
    getUnificadoData: (cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).getUnificadoData(),
    edit: (id, data, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).editarGasto(id, data),
    delete: (id, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).eliminarGasto(id),
    getCalculos: (cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).getCalculosData(),
    updateCalculos: (tableNum, filters, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).updateCalculosTable(tableNum, filters),
    getBalance: (cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).getBalanceData(),
    editBalance: (rowNum, data, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).editarBalance(rowNum, data),
    getWallet: (cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).getWalletData(),
    updateWallet: (tableNum, filters, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).updateWalletFilters(tableNum, filters),
    editWallet: (rowNum, data, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).editarWallet(rowNum, data),
    addWallet: (data, cb, err) => google.script.run.withSuccessHandler(cb).withFailureHandler(err).agregarWallet(data)
  };
</script>
