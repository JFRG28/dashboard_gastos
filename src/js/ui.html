<script>
  let opcionesGlobales = null;
  let rawUnificadoData = [];
  let filteredData = [];
  let unificadoHeaders = [];
  let isDataLoaded = false;
  
  let currentPage = 1;
  let pageSize = 20;
  let currentSortCol = 'ID';
  let currentSortDir = 'desc';

  window.onload = () => {
    const hoy = new Date();
    document.getElementById('fecha_cargo').value = new Date(hoy - (hoy.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
    API.getOptions(opts => { opcionesGlobales = opts; llenarSelectores(opts); });
  };

  function llenarSelectores(opts) {
    const map = {'tipo_gasto': opts.tiposGasto, 'forma_pago': opts.formasPago, 'tag': opts.tags, 'categoria': opts.categorias, 'se_divide': opts.seDivide, 'gasto_x_mes': opts.abrevs};
    for (let id in map) {
      const el = document.getElementById(id);
      if (el) {
        el.innerHTML = '';
        map[id].forEach(o => el.add(new Option(o, o)));
      }
      
      const editEl = document.getElementById('edit-' + id);
      if (editEl) {
        editEl.innerHTML = '';
        map[id].forEach(o => editEl.add(new Option(o, o)));
      }
    }
    actualizarAbrev();
    if (typeof actualizarEditAbrev === 'function') {
      actualizarEditAbrev();
    }
  }

  function submitForm() {
    const form = document.getElementById('formGasto');
    const out = document.getElementById('output');
    if (!form.checkValidity()) return form.reportValidity();
    
    const data = {};
    new FormData(form).forEach((v, k) => data[k] = v);
    document.getElementById('btnSubmit').disabled = true;
    out.innerText = "Enviando...";

    API.save(data, res => {
      out.innerText = res;
      form.reset();
      isDataLoaded = false; // Mark data as stale to reload on next visit
      window.onload();
      document.getElementById('btnSubmit').disabled = false;
    }, err => { alert(err); document.getElementById('btnSubmit').disabled = false; });
  }

  function toggleMensualidades() {
    const isMens = ['MSI', 'MCI'].includes(document.getElementById('tipo_gasto').value);
    document.getElementById('mensualidadesGroup').classList.toggle('hidden-field', !isMens);
  }

  function actualizarAbrev() {
    const f = new Date(document.getElementById('fecha_cargo').value + "T00:00:00");
    const meses = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    const el = document.getElementById('gasto_x_mes');
    if (el) el.value = meses[f.getMonth()];
  }

  /* Navigation Functionality */
  function nav(sectionId, el) {
    document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
      link.classList.remove('active');
    });
    if (el) {
      el.classList.add('active');
    } else {
      // Find element matching sectionId link if called programmatic
      const links = document.querySelectorAll('.navbar-nav .nav-link');
      links.forEach(l => {
        if (l.getAttribute('onclick') && l.getAttribute('onclick').includes(sectionId)) {
          l.classList.add('active');
        }
      });
    }

    document.querySelectorAll('.content-section').forEach(sec => {
      sec.classList.add('d-none');
    });

    const target = document.getElementById('sec-' + sectionId);
    if (target) {
      target.classList.remove('d-none');
    }

    if (sectionId === 'unificado_v4') {
      if (!isDataLoaded) {
        cargarDatosUnificado();
      }
    } else if (sectionId === 'cálculos') {
      cargarCalculosDashboard();
    } else if (sectionId === 'balance') {
      cargarBalance();
    }
  }

  /* Load Unificado Sheet Data */
  function cargarDatosUnificado() {
    const spinner = document.getElementById('unificado-loading');
    const tableCont = document.getElementById('unificado-table-container');
    
    spinner.classList.remove('d-none');
    tableCont.classList.add('d-none');

    API.getUnificadoData(res => {
      unificadoHeaders = res.headers;
      
      // Helper to map index dynamically by matching string in header
      const getHeaderIndex = (hName) => {
        return unificadoHeaders.findIndex(h => h.toLowerCase().includes(hName.toLowerCase()));
      };

      // Identify column indices based on sheet headers
      const colIndices = {
        id: getHeaderIndex("id"),
        concepto: getHeaderIndex("concepto"),
        monto: getHeaderIndex("monto"),
        tipo: getHeaderIndex("tipo"),
        formaPago: getHeaderIndex("forma"),
        mesCargo: getHeaderIndex("mes cargo") !== -1 ? getHeaderIndex("mes cargo") : getHeaderIndex("mes"),
        anioCargo: getHeaderIndex("año") !== -1 ? getHeaderIndex("año") : getHeaderIndex("anio"),
        fechaCargo: getHeaderIndex("fecha cargo") !== -1 ? getHeaderIndex("fecha cargo") : getHeaderIndex("fecha de cargo") !== -1 ? getHeaderIndex("fecha de cargo") : 7,
        fechaPago: getHeaderIndex("fecha pago") !== -1 ? getHeaderIndex("fecha pago") : getHeaderIndex("fecha de pago") !== -1 ? getHeaderIndex("fecha de pago") : 8,
        categoria: getHeaderIndex("categor"),
        noMens: getHeaderIndex("no_mens") !== -1 ? getHeaderIndex("no_mens") : getHeaderIndex("mes actual") !== -1 ? getHeaderIndex("mes actual") : getHeaderIndex("no. mens"),
        totalMeses: getHeaderIndex("total_meses") !== -1 ? getHeaderIndex("total_meses") : getHeaderIndex("total de meses"),
        tag: getHeaderIndex("tag"),
        seDivide: getHeaderIndex("divide"),
        gastoXMes: getHeaderIndex("gasto_x_mes") !== -1 ? getHeaderIndex("gasto_x_mes") : getHeaderIndex("abrev")
      };

      rawUnificadoData = res.data.map(row => {
        return {
          id: colIndices.id !== -1 ? row[colIndices.id] : "",
          concepto: colIndices.concepto !== -1 ? row[colIndices.concepto] : "",
          monto: colIndices.monto !== -1 ? parseFloat(row[colIndices.monto]) || 0 : 0,
          tipo: colIndices.tipo !== -1 ? row[colIndices.tipo] : "",
          formaPago: colIndices.formaPago !== -1 ? row[colIndices.formaPago] : "",
          mesCargo: colIndices.mesCargo !== -1 ? row[colIndices.mesCargo] : "",
          anioCargo: colIndices.anioCargo !== -1 ? row[colIndices.anioCargo] : "",
          fechaCargo: colIndices.fechaCargo !== -1 ? row[colIndices.fechaCargo] : "",
          fechaPago: colIndices.fechaPago !== -1 ? row[colIndices.fechaPago] : "",
          categoria: colIndices.categoria !== -1 ? row[colIndices.categoria] : "",
          noMens: colIndices.noMens !== -1 ? parseInt(row[colIndices.noMens]) || 0 : 0,
          totalMeses: colIndices.totalMeses !== -1 ? parseInt(row[colIndices.totalMeses]) || 0 : 0,
          tag: colIndices.tag !== -1 ? row[colIndices.tag] : "",
          seDivide: colIndices.seDivide !== -1 ? row[colIndices.seDivide] : "",
          gastoXMes: colIndices.gastoXMes !== -1 ? row[colIndices.gastoXMes] : ""
        };
      });

      populateFilterSelectors();
      
      // Default sort (descending by ID)
      currentSortCol = 'ID';
      currentSortDir = 'desc';
      // Reset headers icons UI
      document.querySelectorAll('th.sortable i').forEach(icon => {
        icon.className = 'fa-solid fa-sort ms-1 sort-icon text-muted';
      });
      const idTh = document.querySelector('th.sortable[onclick*="ID"]');
      if (idTh) {
        const icon = idTh.querySelector('i');
        if (icon) icon.className = 'fa-solid fa-sort-down ms-1 sort-icon text-primary';
      }

      applyFilters();
      
      isDataLoaded = true;
      spinner.classList.add('d-none');
      tableCont.classList.remove('d-none');
    }, err => {
      spinner.classList.add('d-none');
      alert("Error al cargar datos: " + err);
    });
  }

  /* Populate Dynamic Dropdowns from Data */
  function populateFilterSelectors() {
    const selectMap = {
      'filter-categoria': 'categoria',
      'filter-tipo': 'tipo',
      'filter-forma-pago': 'formaPago',
      'filter-tag': 'tag',
      'filter-se-divide': 'seDivide',
      'filter-anio': 'anioCargo',
      'filter-mes': 'mesCargo',
      'filter-gasto-x-mes': 'gastoXMes'
    };

    for (let selectId in selectMap) {
      const selectEl = document.getElementById(selectId);
      if (!selectEl) continue;

      const currVal = selectEl.value;
      selectEl.innerHTML = '';
      
      const defaultText = (selectId === 'filter-categoria' || selectId === 'filter-forma-pago') ? 'Todas' : 'Todos';
      selectEl.add(new Option(defaultText, ''));

      const prop = selectMap[selectId];
      const uniqueVals = [...new Set(rawUnificadoData.map(item => item[prop]))]
        .filter(val => val !== null && val !== undefined && val !== '')
        .sort((a, b) => {
          if (typeof a === 'number' && typeof b === 'number') return b - a; // years sorted descending
          return String(a).localeCompare(String(b), undefined, {numeric: true, sensitivity: 'base'});
        });

      uniqueVals.forEach(val => {
        selectEl.add(new Option(val, val));
      });

      if (uniqueVals.includes(currVal)) {
        selectEl.value = currVal;
      }
    }
  }

  /* Filter Logic */
  function applyFilters() {
    const query = document.getElementById('filter-concepto').value.toLowerCase().trim();
    const cat = document.getElementById('filter-categoria').value;
    const tipo = document.getElementById('filter-tipo').value;
    const pago = document.getElementById('filter-forma-pago').value;
    const tag = document.getElementById('filter-tag').value;
    const divide = document.getElementById('filter-se-divide').value;
    const anio = document.getElementById('filter-anio').value;
    const mes = document.getElementById('filter-mes').value;
    const gastoXMes = document.getElementById('filter-gasto-x-mes').value;
    const desde = document.getElementById('filter-fecha-desde').value;
    const hasta = document.getElementById('filter-fecha-hasta').value;
    const minVal = parseFloat(document.getElementById('filter-monto-min').value) || null;
    const maxVal = parseFloat(document.getElementById('filter-monto-max').value) || null;

    filteredData = rawUnificadoData.filter(item => {
      if (query && !item.concepto.toLowerCase().includes(query)) return false;
      if (cat && item.categoria !== cat) return false;
      if (tipo && item.tipo !== tipo) return false;
      if (pago && item.formaPago !== pago) return false;
      if (tag && item.tag !== tag) return false;
      if (divide && item.seDivide !== divide) return false;
      if (anio && String(item.anioCargo) !== anio) return false;
      if (mes && item.mesCargo !== mes) return false;
      if (gastoXMes && item.gastoXMes !== gastoXMes) return false;
      if (desde && item.fechaCargo < desde) return false;
      if (hasta && item.fechaCargo > hasta) return false;
      if (minVal !== null && item.monto < minVal) return false;
      if (maxVal !== null && item.monto > maxVal) return false;
      return true;
    });

    currentPage = 1;
    sortData();
    updateKPIs();
    renderTable();
  }

  /* Reset Filter Fields */
  function resetFilters() {
    document.getElementById('filter-concepto').value = '';
    document.getElementById('filter-categoria').value = '';
    document.getElementById('filter-tipo').value = '';
    document.getElementById('filter-forma-pago').value = '';
    document.getElementById('filter-tag').value = '';
    document.getElementById('filter-se-divide').value = '';
    document.getElementById('filter-anio').value = '';
    document.getElementById('filter-mes').value = '';
    document.getElementById('filter-gasto-x-mes').value = '';
    document.getElementById('filter-fecha-desde').value = '';
    document.getElementById('filter-fecha-hasta').value = '';
    document.getElementById('filter-monto-min').value = '';
    document.getElementById('filter-monto-max').value = '';
    
    applyFilters();
  }

  /* Update Dashboard Statistics */
  function updateKPIs() {
    const count = filteredData.length;
    let total = 0;
    filteredData.forEach(item => {
      total += item.monto;
    });

    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

    document.getElementById('kpi-total-gasto').innerText = fmt.format(total);
    document.getElementById('kpi-total-registros').innerText = count;
  }

  /* Sort Logic */
  function sortBy(columnKey, thElement) {
    if (currentSortCol === columnKey) {
      currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
    } else {
      currentSortCol = columnKey;
      currentSortDir = 'asc';
    }

    document.querySelectorAll('th.sortable i').forEach(icon => {
      icon.className = 'fa-solid fa-sort ms-1 sort-icon text-muted';
    });
    
    const icon = thElement.querySelector('i');
    if (icon) {
      icon.className = `fa-solid fa-sort-${currentSortDir === 'asc' ? 'up' : 'down'} ms-1 sort-icon text-primary`;
    }

    sortData();
    renderTable();
  }

  function sortData() {
    filteredData.sort((a, b) => {
      let valA = getSortValue(a, currentSortCol);
      let valB = getSortValue(b, currentSortCol);

      if (typeof valA === 'string' && typeof valB === 'string') {
        return currentSortDir === 'asc' 
          ? valA.localeCompare(valB, undefined, {numeric: true, sensitivity: 'base'}) 
          : valB.localeCompare(valA, undefined, {numeric: true, sensitivity: 'base'});
      } else {
        return currentSortDir === 'asc' ? valA - valB : valB - valA;
      }
    });
  }

  function getSortValue(item, col) {
    switch (col) {
      case 'ID': return parseInt(item.id) || 0;
      case 'Concepto': return (item.concepto || '').toLowerCase();
      case 'Monto': return item.monto;
      case 'Tipo': return (item.tipo || '').toLowerCase();
      case 'Forma de Pago': return (item.formaPago || '').toLowerCase();
      case 'Fecha de Cargo': return item.fechaCargo || '';
      case 'Fecha de Pago': return item.fechaPago || '';
      case 'Categoría': return (item.categoria || '').toLowerCase();
      case 'Mensualidad': return item.noMens;
      case 'Tag': return (item.tag || '').toLowerCase();
      case 'Se Divide': return (item.seDivide || '').toLowerCase();
      default: return '';
    }
  }

  /* Render Table Content */
  function renderTable() {
    const startIdx = (currentPage - 1) * pageSize;
    const endIdx = startIdx + pageSize;
    const pageData = filteredData.slice(startIdx, endIdx);

    const tbody = document.getElementById('unificado-tbody');
    tbody.innerHTML = '';

    if (filteredData.length === 0) {
      document.getElementById('unificado-empty-state').classList.remove('d-none');
      document.getElementById('unificado-tbody').innerHTML = '';
      document.getElementById('pagination-buttons').innerHTML = '';
      document.getElementById('pagination-info').innerText = 'Mostrando 0 registros';
      return;
    }

    document.getElementById('unificado-empty-state').classList.add('d-none');

    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

    pageData.forEach(item => {
      const tr = document.createElement('tr');
      
      let tipoBadgeClass = 'badge-tipo ';
      const tVal = (item.tipo || '').toUpperCase();
      if (tVal.includes('MSI')) tipoBadgeClass += 'badge-tipo-msi';
      else if (tVal.includes('MCI')) tipoBadgeClass += 'badge-tipo-mci';
      else tipoBadgeClass += 'badge-tipo-cargo';

      const divVal = (item.seDivide || '').toUpperCase();
      const isSi = ['SI', 'SÍ', 'YES', 'TRUE', '1'].includes(divVal);
      const divideBadgeClass = isSi ? 'badge-se-divide-si' : 'badge-se-divide-no';
      
      const mensDisplay = item.totalMeses > 0 ? `${item.noMens} / ${item.totalMeses}` : '-';

      tr.innerHTML = `
        <td class="text-center text-secondary small fw-bold">${item.id || '-'}</td>
        <td class="fw-medium">${item.concepto || '-'}</td>
        <td class="text-end fw-bold text-dark">${fmt.format(item.monto)}</td>
        <td class="text-center"><span class="badge ${tipoBadgeClass}">${item.tipo || '-'}</span></td>
        <td class="text-center text-secondary small">${item.formaPago || '-'}</td>
        <td class="text-center small">${item.fechaCargo || '-'}</td>
        <td class="text-center small text-muted">${item.fechaPago || '-'}</td>
        <td class="text-center"><span class="badge-category">${item.categoria || '-'}</span></td>
        <td class="text-center small text-secondary">${mensDisplay}</td>
        <td class="text-center"><span class="badge badge-tag">${item.tag || '-'}</span></td>
        <td class="text-center"><span class="badge ${divideBadgeClass}">${item.seDivide || '-'}</span></td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary rounded-circle border-0" onclick="abrirModalEdicion(${item.id})">
            <i class="fa-solid fa-pen"></i>
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    renderPaginationControls();
  }

  /* Render Pagination Elements */
  function renderPaginationControls() {
    const totalPages = Math.ceil(filteredData.length / pageSize);
    const container = document.getElementById('pagination-buttons');
    container.innerHTML = '';

    const startRecord = filteredData.length > 0 ? (currentPage - 1) * pageSize + 1 : 0;
    const endRecord = Math.min(currentPage * pageSize, filteredData.length);
    document.getElementById('pagination-info').innerText = `Mostrando ${startRecord} a ${endRecord} de ${filteredData.length} registros`;

    if (totalPages <= 1) return;

    const addPageItem = (page, label, active = false, disabled = false) => {
      const li = document.createElement('li');
      li.className = `page-item ${active ? 'active' : ''} ${disabled ? 'disabled' : ''}`;
      
      const a = document.createElement('a');
      a.className = 'page-link';
      a.href = '#';
      a.innerHTML = label;
      a.onclick = (e) => {
        e.preventDefault();
        if (!disabled && !active) {
          currentPage = page;
          renderTable();
        }
      };
      li.appendChild(a);
      container.appendChild(li);
    };

    addPageItem(1, '<i class="fa-solid fa-angles-left"></i>', false, currentPage === 1);
    addPageItem(currentPage - 1, '<i class="fa-solid fa-angle-left"></i>', false, currentPage === 1);

    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) {
      startPage = Math.max(1, endPage - 4);
    }

    for (let p = startPage; p <= endPage; p++) {
      addPageItem(p, p, p === currentPage);
    }

    addPageItem(currentPage + 1, '<i class="fa-solid fa-angle-right"></i>', false, currentPage === totalPages);
    addPageItem(totalPages, '<i class="fa-solid fa-angles-right"></i>', false, currentPage === totalPages);
  }

  function changePageSize(size) {
    pageSize = parseInt(size);
    currentPage = 1;
    renderTable();
  }

  /* Edit Modal Functionality */
  let modalEdicionBS = null;

  function abrirModalEdicion(id) {
    const item = rawUnificadoData.find(d => String(d.id) === String(id));
    if (!item) return;

    document.getElementById('edit-id-label').innerText = item.id;
    document.getElementById('edit-id').value = item.id;
    document.getElementById('edit-concepto').value = item.concepto || '';
    document.getElementById('edit-monto').value = item.monto || '';
    document.getElementById('edit-tipo_gasto').value = item.tipo || '';
    document.getElementById('edit-forma_pago').value = item.formaPago || '';
    document.getElementById('edit-fecha_cargo').value = item.fechaCargo || '';
    document.getElementById('edit-fecha_pago').value = item.fechaPago || '';
    document.getElementById('edit-categoria').value = item.categoria || '';
    document.getElementById('edit-no_mens').value = item.noMens || 0;
    document.getElementById('edit-total_meses').value = item.totalMeses || 0;
    document.getElementById('edit-tag').value = item.tag || '';
    document.getElementById('edit-se_divide').value = item.seDivide || '';
    
    toggleEditMensualidades();
    
    // Set gasto_x_mes
    const abrevEl = document.getElementById('edit-gasto_x_mes');
    if (item.gastoXMes) {
      abrevEl.value = item.gastoXMes;
    } else {
      actualizarEditAbrev();
    }
    
    document.getElementById('edit-output').innerText = '';
    document.getElementById('btnEditSubmit').disabled = false;

    // Show modal using Bootstrap JS API
    if (!modalEdicionBS) {
      modalEdicionBS = new bootstrap.Modal(document.getElementById('editModal'));
    }
    modalEdicionBS.show();
  }

  function toggleEditMensualidades() {
    const el = document.getElementById('edit-tipo_gasto');
    if (!el) return;
    const isMens = ['MSI', 'MCI'].includes(el.value);
    document.getElementById('edit-mensualidadesGroup').classList.toggle('hidden-field', !isMens);
  }

  function actualizarEditAbrev() {
    const cargoEl = document.getElementById('edit-fecha_cargo');
    const abrevEl = document.getElementById('edit-gasto_x_mes');
    if (!cargoEl || !abrevEl || !cargoEl.value) return;
    
    const f = new Date(cargoEl.value + "T00:00:00");
    const meses = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    abrevEl.value = meses[f.getMonth()];
  }

  function submitEditForm() {
    const form = document.getElementById('formEditGasto');
    const out = document.getElementById('edit-output');
    const btn = document.getElementById('btnEditSubmit');
    if (!form.checkValidity()) return form.reportValidity();
    
    const id = document.getElementById('edit-id').value;
    const data = {};
    new FormData(form).forEach((v, k) => data[k] = v);
    
    btn.disabled = true;
    out.innerText = "Guardando cambios...";
    out.className = "text-center mt-3 small fw-bold text-muted";

    API.edit(id, data, res => {
      out.innerText = res;
      out.className = "text-center mt-3 small fw-bold text-success";
      
      // Mark data as stale to trigger refresh
      isDataLoaded = false;
      
      // Delay closing modal and reloading
      setTimeout(() => {
        if (modalEdicionBS) {
          modalEdicionBS.hide();
        }
        cargarDatosUnificado();
      }, 1200);
      
    }, err => {
      out.innerText = "Error: " + err;
      out.className = "text-center mt-3 small fw-bold text-danger";
      btn.disabled = false;
    });
  }

  let calculosLoaded = false;

  function cargarCalculosDashboard() {
    const target = document.getElementById('sec-cálculos');
    if (!target) return;

    if (!calculosLoaded) {
      showCalculosSpinners();
    }

    API.getCalculos(data => {
      if (!data) return;
      calculosLoaded = true;
      renderCalculosData(data);
    }, err => {
      alert("Error al cargar cálculos: " + err);
    });
  }

  function showCalculosSpinners() {
    const spinners = ['calc-t1-values', 'calc-t2-values', 'calc-t3-values'];
    spinners.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<td colspan="12" class="text-center text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Cargando...</td>';
    });
  }

  function populateSelectOptions(selectId, optionsArray, selectedValue) {
    const el = document.getElementById(selectId);
    if (!el) return;
    el.innerHTML = '';
    optionsArray.forEach(o => {
      const opt = new Option(o, o);
      if (String(o) === String(selectedValue)) opt.selected = true;
      el.add(opt);
    });
  }

  function renderCalculosData(data) {
    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
    const mesesCompletos = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    // 1. Populate filters if not already populated
    if (document.getElementById('calc-t1-mes').options.length === 0) {
      populateSelectOptions('calc-t1-mes', mesesCompletos, data.t1.mes);
      document.getElementById('calc-t1-anio').value = data.t1.anio;
    }
    if (document.getElementById('calc-t2-mes').options.length === 0) {
      populateSelectOptions('calc-t2-mes', mesesCompletos, data.t2.mes);
      document.getElementById('calc-t2-anio').value = data.t2.anio;
      const tarjetas = opcionesGlobales ? opcionesGlobales.formasPago : [data.t2.tarjeta];
      populateSelectOptions('calc-t2-tarjeta', tarjetas, data.t2.tarjeta);
    }
    if (document.getElementById('calc-t3-mes').options.length === 0) {
      populateSelectOptions('calc-t3-mes', mesesCompletos, data.t3.mes);
      document.getElementById('calc-t3-anio').value = data.t3.anio;
    }

    // 2. Render Table 1
    const t1HeadersEl = document.getElementById('calc-t1-headers');
    const t1ValuesEl = document.getElementById('calc-t1-values');
    if (t1HeadersEl && t1ValuesEl) {
      t1HeadersEl.innerHTML = data.t1.headers.map(h => `<th class="text-secondary small fw-bold">${h || ''}</th>`).join('');
      t1ValuesEl.innerHTML = data.t1.values.map((v, idx) => {
        let textClass = 'text-dark';
        if (idx === 2) {
          textClass = v < 0 ? 'text-danger' : (v > 0 ? 'text-success' : 'text-dark');
        }
        return `<td class="${textClass}">${fmt.format(Number(v) || 0)}</td>`;
      }).join('');
    }

    // 3. Render Table 2
    const t2HeadersEl = document.getElementById('calc-t2-headers');
    const t2ValuesEl = document.getElementById('calc-t2-values');
    if (t2HeadersEl && t2ValuesEl) {
      t2HeadersEl.innerHTML = data.t2.headers.map(h => `<th class="text-secondary small fw-bold">${h || ''}</th>`).join('');
      t2ValuesEl.innerHTML = data.t2.values.map((v, idx) => {
        let textClass = 'text-dark';
        const hName = String(data.t2.headers[idx] || '').toUpperCase();
        if (hName.includes('DIFERENCIA')) {
          textClass = v < 0 ? 'text-danger' : (v > 0 ? 'text-success' : 'text-dark');
        }
        return `<td class="${textClass}">${fmt.format(Number(v) || 0)}</td>`;
      }).join('');
    }

    // 4. Render Table 3
    const t3HeadersEl = document.getElementById('calc-t3-headers');
    const t3ValuesEl = document.getElementById('calc-t3-values');
    if (t3HeadersEl && t3ValuesEl) {
      t3HeadersEl.innerHTML = data.t3.headers.map(h => `<th class="text-secondary small fw-bold">${h || ''}</th>`).join('');
      t3ValuesEl.innerHTML = data.t3.values.map((v, idx) => {
        let textClass = 'text-dark';
        const hName = String(data.t3.headers[idx] || '').toUpperCase();
        if (hName.includes('DIFERENCIA')) {
          textClass = v < 0 ? 'text-danger' : (v > 0 ? 'text-success' : 'text-dark');
        }
        return `<td class="${textClass}">${fmt.format(Number(v) || 0)}</td>`;
      }).join('');
    }
  }

  function onCalcFilterChange(tableNum) {
    let filters = {};
    if (tableNum === 1) {
      filters.anio = document.getElementById('calc-t1-anio').value;
      filters.mes = document.getElementById('calc-t1-mes').value;
      document.getElementById('calc-t1-values').innerHTML = '<td colspan="5" class="text-center text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Actualizando...</td>';
    } else if (tableNum === 2) {
      filters.tarjeta = document.getElementById('calc-t2-tarjeta').value;
      filters.anio = document.getElementById('calc-t2-anio').value;
      filters.mes = document.getElementById('calc-t2-mes').value;
      document.getElementById('calc-t2-values').innerHTML = '<td colspan="12" class="text-center text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Actualizando...</td>';
    } else if (tableNum === 3) {
      filters.anio = document.getElementById('calc-t3-anio').value;
      filters.mes = document.getElementById('calc-t3-mes').value;
      document.getElementById('calc-t3-values').innerHTML = '<td colspan="10" class="text-center text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Actualizando...</td>';
    }

    API.updateCalculos(tableNum, filters, data => {
      renderCalculosData(data);
    }, err => {
      alert("Error al actualizar filtros: " + err);
      cargarCalculosDashboard();
    });
  }

  /* Balance Section Functionality */
  let rawBalanceData = [];
  let filteredBalanceData = [];
  let isBalanceLoaded = false;
  let currentBalPage = 1;
  let balPageSize = 20;

  function cargarBalance() {
    const loading = document.getElementById('bal-loading');
    const tableCont = document.getElementById('bal-table-container');
    
    if (!isBalanceLoaded) {
      loading.classList.remove('d-none');
      tableCont.classList.add('d-none');
    }

    API.getBalance(data => {
      loading.classList.add('d-none');
      tableCont.classList.remove('d-none');
      isBalanceLoaded = true;

      if (!data) return;

      const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
      document.getElementById('bal-kpi-total').innerText = fmt.format(data.kpis.total);
      document.getElementById('bal-kpi-debito').innerText = fmt.format(data.kpis.debito);
      document.getElementById('bal-kpi-invertido').innerText = fmt.format(data.kpis.invertido);
      document.getElementById('bal-kpi-debenser').innerText = fmt.format(data.kpis.sumaDebenSer);
      
      const diffVal = data.kpis.sumaDiferencia;
      const diffEl = document.getElementById('bal-kpi-diferencia');
      diffEl.innerText = fmt.format(diffVal);

      rawBalanceData = data.rows || [];
      filtrarBalance();
    }, err => {
      loading.classList.add('d-none');
      alert("Error al cargar balance: " + err);
    });
  }

  function filtrarBalance() {
    const searchVal = document.getElementById('bal-filter-search').value.toLowerCase().trim();
    const tipoVal = document.getElementById('bal-filter-tipo').value;

    filteredBalanceData = rawBalanceData.filter(item => {
      if (tipoVal && item.tipo !== tipoVal) return false;
      if (searchVal) {
        const text = `${item.concepto} ${item.comentarios} ${item.restricciones}`.toLowerCase();
        if (!text.includes(searchVal)) return false;
      }
      return true;
    });

    currentBalPage = 1;
    document.getElementById('bal-count-badge').innerText = `${filteredBalanceData.length} registros`;
    renderBalanceTable();
  }

  function renderBalanceTable() {
    const startIdx = (currentBalPage - 1) * balPageSize;
    const endIdx = startIdx + balPageSize;
    const pageData = filteredBalanceData.slice(startIdx, endIdx);

    const tbody = document.getElementById('bal-tbody');
    const emptyState = document.getElementById('bal-empty-state');
    
    tbody.innerHTML = '';

    if (filteredBalanceData.length === 0) {
      emptyState.classList.remove('d-none');
      document.getElementById('bal-pagination-buttons').innerHTML = '';
      document.getElementById('bal-pagination-info').innerText = 'Mostrando 0 registros';
      return;
    }

    emptyState.classList.add('d-none');
    const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

    pageData.forEach(item => {
      const tr = document.createElement('tr');
      
      let badgeClass = 'badge bg-light text-dark';
      let typeLabel = item.tipo;
      if (item.tipo === 'D') {
        badgeClass = 'badge bg-info-subtle text-info border border-info-subtle';
        typeLabel = 'Débito (D)';
      } else if (item.tipo === 'I') {
        badgeClass = 'badge bg-primary-subtle text-primary border border-primary-subtle';
        typeLabel = 'Invertido (I)';
      }

      const diffVal = Number(item.diferencia) || 0;
      const diffClass = diffVal < 0 ? 'text-danger fw-bold' : (diffVal > 0 ? 'text-success fw-bold' : 'text-muted');

      tr.innerHTML = `
        <td class="text-center"><span class="${badgeClass} small fw-bold">${typeLabel}</span></td>
        <td class="fw-medium">${item.concepto || '-'}</td>
        <td class="text-end fw-bold text-dark">${fmt.format(item.monto)}</td>
        <td class="text-end text-secondary">${fmt.format(item.debenSer)}</td>
        <td class="text-end ${diffClass}">${fmt.format(diffVal)}</td>
        <td class="small text-secondary" style="max-width: 250px; white-space: pre-wrap;">${item.comentarios || '-'}</td>
        <td class="small text-muted" style="max-width: 250px; white-space: pre-wrap;">${item.restricciones || '-'}</td>
        <td class="text-center">
          <button class="btn btn-link text-primary p-0" onclick="abrirEditBalance(${item.rowNum})"><i class="fa-solid fa-pen"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    renderBalancePagination();
  }

  function renderBalancePagination() {
    const totalPages = Math.ceil(filteredBalanceData.length / balPageSize);
    const container = document.getElementById('bal-pagination-buttons');
    container.innerHTML = '';

    const startRecord = filteredBalanceData.length > 0 ? (currentBalPage - 1) * balPageSize + 1 : 0;
    const endRecord = Math.min(currentBalPage * balPageSize, filteredBalanceData.length);
    document.getElementById('bal-pagination-info').innerText = `Mostrando ${startRecord} a ${endRecord} de ${filteredBalanceData.length} registros`;

    if (totalPages <= 1) return;

    const addPageItem = (page, label, active = false, disabled = false) => {
      const li = document.createElement('li');
      li.className = `page-item ${active ? 'active' : ''} ${disabled ? 'disabled' : ''}`;
      
      const a = document.createElement('a');
      a.className = 'page-link';
      a.href = '#';
      a.innerHTML = label;
      a.onclick = (e) => {
        e.preventDefault();
        if (!disabled && !active) {
          currentBalPage = page;
          renderBalanceTable();
        }
      };
      li.appendChild(a);
      container.appendChild(li);
    };

    addPageItem(1, '<i class="fa-solid fa-angles-left"></i>', false, currentBalPage === 1);
    addPageItem(currentBalPage - 1, '<i class="fa-solid fa-angle-left"></i>', false, currentBalPage === 1);

    let startPage = Math.max(1, currentBalPage - 2);
    let endPage = Math.min(totalPages, startPage + 4);
    if (endPage - startPage < 4) {
      startPage = Math.max(1, endPage - 4);
    }

    for (let p = startPage; p <= endPage; p++) {
      addPageItem(p, p, p === currentBalPage);
    }

    addPageItem(currentBalPage + 1, '<i class="fa-solid fa-angle-right"></i>', false, currentBalPage === totalPages);
    addPageItem(totalPages, '<i class="fa-solid fa-angles-right"></i>', false, currentBalPage === totalPages);
  }

  function changeBalPageSize(size) {
    balPageSize = parseInt(size);
    currentBalPage = 1;
    renderBalanceTable();
  }

  let modalEditBalanceBS = null;

  function abrirEditBalance(rowNum) {
    const item = rawBalanceData.find(r => r.rowNum === rowNum);
    if (!item) return;

    document.getElementById('bal-edit-rowNum').value = item.rowNum;
    document.getElementById('bal-edit-tipo').value = item.tipo;
    document.getElementById('bal-edit-concepto').value = item.concepto || '';
    document.getElementById('bal-edit-monto').value = item.monto;
    document.getElementById('bal-edit-debenser').value = item.debenSer;
    document.getElementById('bal-edit-comentarios').value = item.comentarios || '';
    document.getElementById('bal-edit-restricciones').value = item.restricciones || '';

    // Clear output status
    const out = document.getElementById('bal-edit-output');
    out.className = 'd-none';
    out.innerText = '';
    
    document.getElementById('btn-save-balance').disabled = false;

    if (!modalEditBalanceBS) {
      modalEditBalanceBS = new bootstrap.Modal(document.getElementById('modalEditBalance'));
    }
    modalEditBalanceBS.show();
  }

  function submitEditBalance(e) {
    e.preventDefault();
    
    const rowNum = parseInt(document.getElementById('bal-edit-rowNum').value);
    const btn = document.getElementById('btn-save-balance');
    const out = document.getElementById('bal-edit-output');
    
    btn.disabled = true;
    out.className = "text-center mt-3 small fw-bold text-primary";
    out.innerHTML = '<div class="spinner-border spinner-border-sm me-2" role="status"></div>Guardando cambios...';
    
    const payload = {
      tipo: document.getElementById('bal-edit-tipo').value,
      concepto: document.getElementById('bal-edit-concepto').value,
      monto: parseFloat(document.getElementById('bal-edit-monto').value) || 0,
      debenSer: parseFloat(document.getElementById('bal-edit-debenser').value) || 0,
      comentarios: document.getElementById('bal-edit-comentarios').value,
      restricciones: document.getElementById('bal-edit-restricciones').value
    };

    API.editBalance(rowNum, payload, res => {
      out.className = "text-center mt-3 small fw-bold text-success";
      out.innerText = res;
      
      setTimeout(() => {
        if (modalEditBalanceBS) {
          modalEditBalanceBS.hide();
        }
        cargarBalance(); // Reload data & update KPIs
      }, 1200);
    }, err => {
      out.className = "text-center mt-3 small fw-bold text-danger";
      out.innerText = "Error: " + err;
      btn.disabled = false;
    });
  }
</script>
